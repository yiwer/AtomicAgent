server {
    listen 80;
    listen [::]:80;
    server_name agent.91boy.cn;
    access_log off;
    error_log /dev/null;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name agent.91boy.cn;
    error_log /dev/null;
    ssl_certificate /etc/letsencrypt/live/agent.91boy.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.91boy.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Query strings may contain short-lived artifact signatures; do not log them.
    access_log off;
    location / {
        if (-f /etc/nginx/atomicagent-maintenance) { return 503; }
        proxy_pass http://127.0.0.1:14310;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_cookie_flags atomic_session secure;
    }
}
